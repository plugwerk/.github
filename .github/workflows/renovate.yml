# Reusable Renovate workflow for the plugwerk org.
#
# Why reusable: every plugwerk repo runs the same Renovate binary
# against its own renovate.json with the same SHA-pinned action and
# the same logging conventions. Duplicating the 70-line trigger in
# every consumer repo means three places to touch on every action
# bump. This workflow holds the real logic; consumers add a 15-line
# stub that wires their schedule + permissions in.
#
# Token model: this is single-repo. Each caller's GITHUB_TOKEN is
# scoped to its own repo, so when the renovate binary opens branches
# and PRs, it does so against the calling repo only. No PAT, no
# GitHub App, no cross-repo write access.
#
# Trigger: callers decide when to fire. Recommended pattern is
# `cron: "0 4 * * 1-5"` (Mon-Fri 04:00 UTC) plus workflow_dispatch
# for on-demand runs from the Actions tab.

name: Renovate (reusable)

on:
  workflow_call:
    inputs:
      logLevel:
        description: "Renovate log level (info or debug)."
        required: false
        type: string
        default: "info"
      configurationFile:
        description: "Path to the calling repo's renovate config."
        required: false
        type: string
        default: ".github/renovate.json"

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Concurrency keyed by the calling repo so two Renovate runs
    # against the same repo cannot race on branch creation. Different
    # repos are independent and run in parallel without contention.
    concurrency:
      group: renovate-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    # Lift the input into an env var so the run-step never interpolates
    # workflow input straight into a shell field — defensive practice
    # that satisfies hardened-runner injection-prevention guidance even
    # though the input has limited shape (string from a workflow_call).
    env:
      RENOVATE_LOG_LEVEL: ${{ inputs.logLevel }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Renovate
        uses: renovatebot/github-action@79dc0ba74dc3de28db0a7aeb1d0b95d5bf5fde2a # v46.1.13
        with:
          configurationFile: ${{ inputs.configurationFile }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ env.RENOVATE_LOG_LEVEL }}
          # renovatebot/github-action v46 no longer infers the target
          # repository from the runtime context — without an explicit
          # RENOVATE_REPOSITORIES the run completes successfully but
          # logs `WARN: No repositories found` and does nothing. We
          # set it to ${{ github.repository }} which always resolves
          # to the *caller's* owner/repo on a workflow_call, so this
          # remains single-repo by construction.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Manual runs (workflow_dispatch from the Actions tab or
          # `gh workflow run renovate.yml`) override the per-config
          # `schedule` filter so PRs are opened immediately. Scheduled
          # cron triggers leave the schedule intact and respect the
          # `before 6am every weekday` window from the org default.
          # The conditional resolves to `{}` (an empty no-op JSON
          # object) for non-dispatch triggers, keeping the env var
          # always-present and parseable.
          RENOVATE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '{"schedule":null}' || '{}' }}
